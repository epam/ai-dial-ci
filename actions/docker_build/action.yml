name: Build Docker image for a platform
description: Build a Docker image for one platform on the current (native) runner, scan it with Trivy and (optionally) push it to Docker Hub and GHCR by digest
inputs:
  platform:
    description: Docker build platform (e.g. linux/amd64)
    required: true
  pair:
    description: Platform name safe for use in names (e.g. linux-amd64)
    required: true
  maximize-build-space:
    description: Maximize build space by removing unwanted software before the build
    default: "false"
  dockerfile-path:
    description: Path to the Dockerfile
    default: "Dockerfile"
  build-args:
    description: |
      Docker build arguments (newline-separated list-like string)
      ref: https://github.com/docker/build-push-action#inputs
    default: ""
  gpr-username:
    description: GitHub Package Registry username (for pulling packages from image being built)
    default: ${{ github.actor }}
  gpr-password:
    description: GitHub Package Registry password/token. No build secrets are passed if empty
    default: ""
  bypass-checks:
    description: Do not fail pipeline if checks failed
    default: "false"
  trivy-enabled:
    description: Enable Trivy scanning (the image is built for scanning only when enabled)
    default: "true"
  trivy-bypassed:
    description: Do not fail pipeline if Trivy failed
    default: "false"
  trivy-severity:
    description: Severities of vulnerabilities to fail the build
    default: "CRITICAL,HIGH"
  trivy-severity-for-sarif:
    description: Severities of vulnerabilities in SARIF report
    default: "CRITICAL,HIGH"
  trivy-limit-severities-for-sarif:
    description: By default SARIF format enforces output of all vulnerabilities regardless of configured severities. To override this behavior set this parameter to true and specify desired severities in the `trivy-severity-for-sarif` parameter
    default: "true"
  push-enabled:
    description: Push the image by digest to registry(ies). The digest is uploaded as the digests-<pair> artifact
    default: "false"
  image-name:
    description: Image name without registry and tag (pushed to Docker Hub as is and to ghcr.io/<image-name>). Required for pushing
    default: ""
  image-tags:
    description: |
      Docker image tags (or tag rules) for docker/metadata-action tags input, used to generate image labels. Required for pushing
      ref: https://github.com/docker/metadata-action#tags-input
    default: ""
  ghcr-username:
    description: GitHub Container Registry username. This is required for pushing
    default: ${{ github.actor }}
  ghcr-password:
    description: GitHub Container Registry password/token. This is required for pushing
    default: ""
  dockerhub-username:
    description: Docker Hub username. This is required for pushing
    default: ""
  dockerhub-password:
    description: Docker Hub password/token. This is required for pushing
    default: ""

runs:
  using: "composite"
  steps:
    - name: Maximize build space
      uses: nepalevov/maximize-build-space@046c48361370e2f3fa758bd2f10c6ce29109ef62 # v1.1.0
      if: ${{ inputs.maximize-build-space == 'true' }}
      with:
        remove-dotnet: "true"
        remove-android: "true"
        remove-haskell: "true"
        remove-codeql: "true"
        remove-large-packages: "true"
        remove-cached-tools: "true"
        remove-swapfile: "true"
        remove-java: "true"
        remove-swift: "true"
        remove-julia: "true"
        remove-browsers: ${{ inputs.platform == 'linux/arm64' && 'false' || 'true' }}
        remove-cloud-tools: "true"
        remove-kubernetes-tools: "true"
        remove-powershell: "true"
        remove-container-tools: "true"
        remove-rust: "true"
        remove-python: "true"
        remove-node: "true"
        remove-go: "true"
        remove-ruby: "true"
        docker-cleanup: "true"
        set-tmpdir: "true"
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Docker meta
      id: meta
      if: ${{ inputs.push-enabled == 'true' }}
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ${{ inputs.image-name }}
          ghcr.io/${{ inputs.image-name }}
        flavor: |
          latest=false
        tags: ${{ inputs.image-tags }}
    - name: Login to GitHub Container Registry
      if: ${{ inputs.push-enabled == 'true' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ inputs.ghcr-username }}
        password: ${{ inputs.ghcr-password }}
    - name: Login to Docker Hub
      if: ${{ inputs.push-enabled == 'true' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}

    # --- Build for scanning (native platform, loaded into the local image store)
    - name: Build and export to Docker
      if: ${{ inputs.trivy-enabled == 'true' }}
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ${{ inputs.dockerfile-path }}
        load: true
        platforms: ${{ inputs.platform }}
        tags: scan/${{ inputs.pair }}:${{ github.sha }}
        build-args: ${{ inputs.build-args }}
        secrets: ${{ inputs.gpr-password != '' && format('GPR_USERNAME={0}{1}GPR_PASSWORD={2}', inputs.gpr-username, fromJSON('"\n"'), inputs.gpr-password) || '' }}
      env:
        DOCKER_BUILD_RECORD_UPLOAD: false

    - name: Run Trivy scanner (JSON output, no fail)
      id: trivy
      if: ${{ inputs.trivy-enabled == 'true' }}
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: scan/${{ inputs.pair }}:${{ github.sha }}
        format: json
        exit-code: "0" # Findings are handled by the last "trivy convert" step
        output: trivy-results.json
        ignore-unfixed: "true"
        vuln-type: os,library
        scanners: vuln,secret
      env:
        CONTINUE_ON_ERROR: ${{ inputs.trivy-bypassed == 'true' || inputs.bypass-checks == 'true' }} # Hack to use the condition below as a boolean
        TRIVY_DISABLE_VEX_NOTICE: true
      continue-on-error: ${{ fromJSON(env.CONTINUE_ON_ERROR) }}
    - name: Generate Trivy report (SARIF)
      id: trivy-generate-sarif
      # Do not generate SARIF reports on private repos - GitHub Advanced Security is not enabled
      # Do not generate SARIF reports for pull requests from forks
      if: ${{ steps.trivy.outcome == 'success' && !github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) }}
      shell: bash
      run: trivy convert --format sarif --output trivy-results.sarif --exit-code 0 trivy-results.json
      env:
        CONTINUE_ON_ERROR: ${{ inputs.trivy-bypassed == 'true' || inputs.bypass-checks == 'true' }}
        TRIVY_SCANNERS: vuln,secret
        TRIVY_SEVERITY: ${{ inputs.trivy-limit-severities-for-sarif == 'true' && inputs.trivy-severity-for-sarif || '' }}
        TRIVY_DISABLE_VEX_NOTICE: true
      continue-on-error: ${{ fromJSON(env.CONTINUE_ON_ERROR) }}
    - name: Upload Trivy report (SARIF)
      if: ${{ steps.trivy-generate-sarif.outcome == 'success' }}
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        sarif_file: trivy-results.sarif
        category: trivy-${{ inputs.pair }}
      env:
        CONTINUE_ON_ERROR: ${{ inputs.trivy-bypassed == 'true' || inputs.bypass-checks == 'true' }}
      continue-on-error: ${{ fromJSON(env.CONTINUE_ON_ERROR) }}
    - name: Generate Trivy report (Table, must fail on findings)
      if: ${{ steps.trivy.outcome == 'success' }}
      shell: bash
      run: trivy convert --format table --exit-code 1 trivy-results.json
      env:
        CONTINUE_ON_ERROR: ${{ inputs.trivy-bypassed == 'true' || inputs.bypass-checks == 'true' }}
        TRIVY_SCANNERS: vuln,secret
        TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
        TRIVY_DISABLE_VEX_NOTICE: true
      continue-on-error: ${{ fromJSON(env.CONTINUE_ON_ERROR) }}

    # --- Push by digest (reached only when the Trivy steps above passed). Layers are reused from the builder's local cache.
    - name: Build and push by digest
      id: push
      if: ${{ inputs.push-enabled == 'true' }}
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ${{ inputs.dockerfile-path }}
        platforms: ${{ inputs.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        outputs: type=image,"name=${{ inputs.image-name }},ghcr.io/${{ inputs.image-name }}",push-by-digest=true,name-canonical=true,push=true
        secrets: ${{ inputs.gpr-password != '' && format('GPR_USERNAME={0}{1}GPR_PASSWORD={2}', inputs.gpr-username, fromJSON('"\n"'), inputs.gpr-password) || '' }}
      env:
        DOCKER_BUILD_RECORD_UPLOAD: false
    - name: Export digest
      if: ${{ inputs.push-enabled == 'true' }}
      shell: bash
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        mkdir -p "${RUNNER_TEMP}/digests"
        touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
    - name: Upload digest
      if: ${{ inputs.push-enabled == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: digests-${{ inputs.pair }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1
