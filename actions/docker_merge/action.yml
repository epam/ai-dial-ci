name: Merge Docker platform images
description: Assemble a multi-platform image from per-platform digests (digests-* artifacts) and push it to Docker Hub and GHCR
inputs:
  image-name:
    description: Image name without registry and tag (pushed to Docker Hub as is and to ghcr.io/<image-name>)
    required: true
  image-tags:
    description: |
      Docker image tags (or tag rules) for docker/metadata-action tags input
      ref: https://github.com/docker/metadata-action#tags-input
    required: true
  ghcr-username:
    description: GitHub Container Registry username
    default: ${{ github.actor }}
  ghcr-password:
    description: GitHub Container Registry password/token
    required: true
  dockerhub-username:
    description: Docker Hub username
    required: true
  dockerhub-password:
    description: Docker Hub password/token
    required: true

runs:
  using: "composite"
  steps:
    - name: Download digests
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ${{ inputs.image-name }}
          ghcr.io/${{ inputs.image-name }}
        flavor: |
          latest=false
        tags: ${{ inputs.image-tags }}
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: index
    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ inputs.ghcr-username }}
        password: ${{ inputs.ghcr-password }}
    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}
    - name: Create multi-platform images and push
      working-directory: ${{ runner.temp }}/digests
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        set -euo pipefail
        annotations=()
        while IFS= read -r a; do
          [ -n "$a" ] && annotations+=(--annotation "$a")
        done < <(jq -r '.annotations // [] | .[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

        for image in "${IMAGE_NAME}" "ghcr.io/${IMAGE_NAME}"; do
          tags=()
          while IFS= read -r t; do tags+=(-t "$t"); done \
            < <(jq -r --arg img "$image:" '.tags[] | select(startswith($img))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for d in *; do sources+=("${image}@sha256:${d}"); done
          docker buildx imagetools create "${annotations[@]}" "${tags[@]}" "${sources[@]}"
        done
    - name: Inspect images
      shell: bash
      run: |
        set -euo pipefail
        while IFS= read -r t; do
          docker buildx imagetools inspect "$t"
        done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
