name: Docker workflow

# Reusable workflow: plan (create build matrix, naming, validation, etc.) --> build (per platform: build, local Trivy scan, push by digest) -> merge (all digests into multi-arch manifest)

on:
  workflow_call:
    inputs:
      meta-images:
        type: string
        description: |
          A newline-separated list of image references, e.g. ghcr.io/owner/app.
          Attributes can be used: `name=<string>` - image base name, `enable=<true|false>` - enable this entry (default true)
          Required for pushing
          ref: https://github.com/docker/metadata-action#images-input
        default: ""
      meta-tags:
        type: string
        description: |
          A newline-separated list of image tags (or tag rules)
          Attributes can be used, see ref
          Required for pushing
          ref: https://github.com/docker/metadata-action#tags-input
        default: ""
      push:
        type: boolean
        description: Push image(s) to registries
        default: false
      registry-login:
        type: string
        description: Log in to the registries specified in `registry-auths` secret (one of `auto`, `true`, `false`). The `auto` logs in only when `push` is true
        default: auto
      platforms:
        type: string
        description: Docker build platforms (comma-separated). Each platform is built on its own runner natively
        default: "linux/amd64"
      dockerfile-path:
        type: string
        description: Path to the Dockerfile
        default: "Dockerfile"
      context:
        type: string
        description: Docker build context path
        default: "."
      target:
        type: string
        description: Docker build target stage (the last stage is built if empty)
        default: ""
      build-args:
        type: string
        description: |
          A newline-separated list of Docker build arguments, e.g. `FOO=bar`
          ref: https://docs.docker.com/reference/cli/docker/buildx/build/#build-arg
        default: ""
      pre-build-script:
        type: string
        description: Bash script to run before the Docker build (e.g. to set the version)
        default: ""
      maximize-build-space:
        type: boolean
        description: Maximize build space by removing unwanted software
        default: false
      trivy-enabled:
        type: boolean
        description: Enable Trivy scanning
        default: true
      trivy-bypassed:
        type: boolean
        description: Do not fail pipeline if Trivy failed
        default: false
      trivy-severity:
        type: string
        description: Severities of vulnerabilities to fail the build
        default: "CRITICAL,HIGH"
      trivy-severity-for-sarif:
        type: string
        description: Severities of vulnerabilities in SARIF report
        default: "CRITICAL,HIGH"
      trivy-limit-severities-for-sarif:
        type: boolean
        description: By default SARIF format enforces output of all vulnerabilities regardless of configured severities. To override this behavior set this parameter to true and specify desired severities in the `trivy-severity-for-sarif` parameter
        default: true
      trivy-vuln-type:
        type: string
        description: Type of vulnerabilities to scan
        default: "os,library"
      trivy-scanners:
        type: string
        description: Comma-separated list of what security issues to detect
        default: "vuln,secret"
      trivy-ignore-unfixed:
        type: boolean
        description: Ignore unpatched/unfixed vulnerabilities
        default: true
      runs-on:
        type: string
        description: Overrides jobs runs-on settings (json-encoded list). No effect on `build` jobs - they always run on native runners of their platforms
        default: '["ubuntu-latest"]'
    secrets:
      registry-auths:
        description: |
          Registry credentials (YAML list of registry, username, password) for docker/login-action registry-auth input
          ref: https://github.com/docker/login-action#registry-auth
        required: false
      build-secrets:
        description: |
          A newline-separated list of BuildKit secrets as `id=value` (single-line values), e.g. `GPR_USERNAME` and `GPR_PASSWORD`
          ref: https://github.com/docker/build-push-action#inputs
        required: false
    outputs:
      digest:
        description: Digest of the merged image (empty when nothing is pushed)
        value: ${{ jobs.merge.outputs.digest }}
      tags:
        description: Published image references with tags (newline-separated list, empty when nothing is pushed)
        value: ${{ jobs.merge.outputs.tags }}

jobs:
  # Validates workflow inputs, builds per-platform matrix (one native runner per platform) with proper inputs
  plan:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      images: ${{ steps.plan.outputs.images }}
      key: ${{ steps.plan.outputs.key }}
      login: ${{ steps.plan.outputs.login }}
    steps:
      - name: Plan Docker build
        id: plan
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          META_IMAGES: ${{ inputs.meta-images }}
          TAGS: ${{ inputs.meta-tags }}
          PUSH: ${{ inputs.push }}
          REGISTRY_LOGIN: ${{ inputs.registry-login }}
        run: |
          #!/bin/bash
          set -euo pipefail
          # set -x

          # Platforms --> matrix
          matrix='[]'
          IFS=',' read -ra platforms <<<"$PLATFORMS"
          for platform in "${platforms[@]}"; do
            platform="$(echo "$platform" | xargs)"
            case "$platform" in
            linux/amd64) runner='["ubuntu-24.04"]' ;;
            linux/arm64) runner='["ubuntu-24.04-arm"]' ;;
            *)
              echo "::error::Unsupported platform '$platform': only linux/amd64 and linux/arm64 have native runners"
              exit 1
              ;;
            esac
            matrix="$(jq -c --arg p "$platform" --arg r "$runner" '. + [{platform: $p, runner: $r, pair: ($p | gsub("/"; "-"))}]' <<<"$matrix")"
          done
          if [ "$matrix" = '[]' ]; then
            echo "::error::No buildable platforms"
            exit 1
          fi

          # Normalize images input, strip attributes, drop disabled entries
          images=()
          while IFS= read -r line; do
            line="$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' <<<"$line")"
            [ -z "$line" ] && continue
            IFS=',' read -ra parts <<<"$line"
            name="${parts[0]#name=}"
            enable=true
            for part in "${parts[@]:1}"; do
              case "$part" in enable=*) enable="$(tr '[:upper:]' '[:lower:]' <<<"${part#enable=}")" ;; esac
            done
            if [ "$enable" != false ] && [ "$enable" != 0 ]; then
              images+=("$name")
            fi
          done <<<"$META_IMAGES"

          if [ "$PUSH" = true ]; then
            if [ "${#images[@]}" -eq 0 ]; then
              echo "::error::meta-images has no images to push"
              exit 1
            fi
            if [ -z "$(tr -d '[:space:]' <<<"$TAGS")" ]; then
              echo "::error::meta-tags is required for pushing"
              exit 1
            fi
          fi

          # Create a key, e.g. for artifacts and SARIF names, based on the first image, with special chars replaced
          # HACK: ensure to keep `@`: it separates the key from the platform in artifact names
          key="$(tr -c 'A-Za-z0-9._\n-' '-' <<<"${images[0]:-image}")"

          case "$REGISTRY_LOGIN" in
          auto) login="$PUSH" ;;
          true | false) login="$REGISTRY_LOGIN" ;;
          *)
            echo "::error::Invalid registry-login '$REGISTRY_LOGIN': expected auto, true or false"
            exit 1
            ;;
          esac

          {
            # matrix: {"include": [{"platform": "linux/amd64", "runner": "[\"ubuntu-24.04\"]", "pair": "linux-amd64"}, ...]}
            echo "matrix=$(jq -c '{include: .}' <<<"$matrix")"
            echo "images=$(
              IFS=','
              echo "${images[*]:-}"
            )"
            echo "key=$key"
            echo "login=$login"
          } >>"$GITHUB_OUTPUT"

  # One job per platform on a native runner: build --> Trivy --> push by digest
  build:
    name: build (${{ matrix.platform }})
    needs: plan
    strategy:
      fail-fast: false # report Trivy results for every platform even if another one failed
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Pre-build script
        if: ${{ inputs.pre-build-script != '' }}
        shell: bash
        env:
          PRE_BUILD_SCRIPT: ${{ inputs.pre-build-script }}
        run: bash -euo pipefail -c "$PRE_BUILD_SCRIPT"
      - name: Maximize build space
        uses: nepalevov/maximize-build-space@1cee5c5ac2cae961d818c433f68a70345aa9381f # v1.2.0
        if: ${{ inputs.maximize-build-space }}
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          remove-java: "true"
          remove-swift: "true"
          remove-julia: "true"
          remove-browsers: "true"
          remove-cloud-tools: "true"
          remove-kubernetes-tools: "true"
          remove-powershell: "true"
          remove-container-tools: "true"
          remove-rust: "true"
          remove-python: "true"
          remove-node: "true"
          remove-go: "true"
          remove-ruby: "true"
          docker-cleanup: "true"
          set-tmpdir: "true"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Docker meta
        id: meta
        if: ${{ inputs.push }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.meta-images }}
          # Never add `latest` tag automatically; instead pass a tag (or tag rule) to `meta-tags` input if needed
          flavor: |
            latest=false
          tags: ${{ inputs.meta-tags }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest # We'll annotate index on it's creation, so manifest only
      - name: Login to registries
        if: ${{ needs.plan.outputs.login == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry-auth: ${{ secrets.registry-auths }}
      - name: Build and export to Docker
        if: ${{ inputs.trivy-enabled || !inputs.push }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # No annotations and labels (unneeded, image is for scan only)
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile-path }}
          target: ${{ inputs.target }}
          load: true
          platforms: ${{ matrix.platform }}
          tags: scan/${{ matrix.pair }}:${{ github.sha }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.build-secrets }}
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
      - name: Run Trivy scanner (JSON output, no fail)
        id: trivy
        if: ${{ inputs.trivy-enabled }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.pair }}:${{ github.sha }}
          format: json
          exit-code: "0" # Findings are handled by the last "trivy convert" step
          output: trivy-results.json
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          vuln-type: ${{ inputs.trivy-vuln-type }}
          scanners: ${{ inputs.trivy-scanners }}
        env:
          TRIVY_DISABLE_VEX_NOTICE: true
        continue-on-error: ${{ inputs.trivy-bypassed }}
      - name: Generate Trivy report (SARIF)
        id: trivy-generate-sarif
        # Do not generate SARIF reports on private repos - GitHub Advanced Security is not enabled
        # Do not generate SARIF reports for pull requests from forks
        if: ${{ steps.trivy.outcome == 'success' && !github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) }}
        shell: bash
        run: trivy convert --format sarif --output trivy-results.sarif --exit-code 0 trivy-results.json
        env:
          TRIVY_SCANNERS: ${{ inputs.trivy-scanners }}
          TRIVY_SEVERITY: ${{ inputs.trivy-limit-severities-for-sarif && inputs.trivy-severity-for-sarif || '' }}
          TRIVY_DISABLE_VEX_NOTICE: true
        continue-on-error: ${{ inputs.trivy-bypassed }}
      - name: Upload Trivy report (SARIF)
        if: ${{ steps.trivy-generate-sarif.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ needs.plan.outputs.key }}-${{ matrix.pair }}
        continue-on-error: ${{ inputs.trivy-bypassed }}
      - name: Generate Trivy report (Table, must fail on findings)
        if: ${{ steps.trivy.outcome == 'success' }}
        shell: bash
        run: trivy convert --format table --exit-code 1 trivy-results.json
        env:
          TRIVY_SCANNERS: ${{ inputs.trivy-scanners }}
          TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
          TRIVY_DISABLE_VEX_NOTICE: true
        continue-on-error: ${{ inputs.trivy-bypassed }}
      - name: Build and push by digest
        id: push
        if: ${{ inputs.push }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile-path }}
          target: ${{ inputs.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.build-secrets }}
          sbom: true # Provenance attestation is added by default (mode=max for public, mode=min for private repositories). SBOM must be enabled explicitly
          # push-by-digest - Push image without name
          # name-canonical - Add additional canonical name name@<digest>
          # ref https://docs.docker.com/build/exporters/image-registry/
          outputs: type=image,"name=${{ needs.plan.outputs.images }}",push-by-digest=true,name-canonical=true,push=true
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
      - name: Export digest
        if: ${{ inputs.push }}
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-digests-${{ needs.plan.outputs.key }}@${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  # Assembles the multi-platform image manifest with proper tag
  merge:
    needs:
      - plan
      - build
    if: ${{ inputs.push }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
      tags: ${{ steps.inspect.outputs.tags }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digests-${{ needs.plan.outputs.key }}@*
          merge-multiple: true
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.meta-images }}
          flavor: |
            latest=false
          tags: ${{ inputs.meta-tags }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
      - name: Login to registries
        if: ${{ needs.plan.outputs.login == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry-auth: ${{ secrets.registry-auths }}
      - name: Create multi-platform images and push
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          #!/bin/bash
          set -euo pipefail
          shopt -s nullglob
          digests=(*)
          if [ "${#digests[@]}" -eq 0 ]; then
            echo "::error::No digests found (expected docker-digests-* artifacts from the build jobs)"
            exit 1
          fi
          annotations=()
          while IFS= read -r a; do
            [ -n "$a" ] && annotations+=(--annotation "$a")
          done < <(jq -r '.annotations // [] | .[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")

          # Take the image names (e.g. ghcr.io/acme/app, docker.io/acme/app) and for each:
          #  1. pick its tagged references (name:tag) from the metadata, e.g. ghcr.io/acme/app:1.2.3, ghcr.io/acme/app:latest
          #  2. collect the per-platform images (sources) from the digests, e.g. ghcr.io/acme/app@sha256:aaa (amd64), ghcr.io/acme/app@sha256:bbb (arm64)
          #  3. create one multi-arch image from the sources under the tags
          while IFS= read -r image; do
            tags=()
            while IFS= read -r t; do tags+=(-t "$t"); done \
              < <(jq -r --arg img "$image:" '.tags[] | select(startswith($img))' <<<"$DOCKER_METADATA_OUTPUT_JSON")
            sources=()
            for d in "${digests[@]}"; do sources+=("${image}@sha256:${d}"); done
            docker buildx imagetools create "${annotations[@]}" "${tags[@]}" "${sources[@]}"
          done < <(jq -r '[.tags[] | sub(":[^:/]+$"; "")] | unique | .[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
      - name: Inspect images
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          digest=
          summary="$(mktemp)"
          # Iterate over the tags from the metadata, query registry for digest and platforms for each of them
          {
            echo "## Docker image(s)"
            echo
            echo "| Tag | Digest | Platforms |"
            echo "| --- | --- | --- |"
            while IFS= read -r t; do
              manifest="$(docker buildx imagetools inspect "$t" --format '{{json .Manifest}}')"
              jq -r --arg t "$t" '"| `\($t)` | `\(.digest)` | \([.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | unique | join(", ")) |"' <<< "$manifest"
              [ -n "$digest" ] || digest="$(jq -r '.digest' <<< "$manifest")"
            done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          } > "$summary" # not a pipe: the loop must stay in this shell to keep the digest
          tee -a "$GITHUB_STEP_SUMMARY" < "$summary"
          delimiter="ghadelimiter_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "digest=$digest"
            echo "tags<<${delimiter}"
            jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
