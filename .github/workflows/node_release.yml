name: NodeJS Release workflow

on:
  workflow_call:
    inputs:
      promote:
        type: boolean
        description: Promote release to stable (for release-* branches only)
        default: false
      draft-stable-releases:
        type: boolean
        description: Create stable GitHub releases as drafts
        default: false
      bypass-checks:
        type: boolean
        description: Do not fail pipeline if checks failed
        default: false
      format-checks-enabled:
        type: boolean
        description: Enable format_checks
        default: true
      format-checks-bypassed:
        type: boolean
        description: Do not fail pipeline if format_checks failed
        default: false
      style-checks-enabled:
        type: boolean
        description: Enable style_checks
        default: true
      style-checks-bypassed:
        type: boolean
        description: Do not fail pipeline if style_checks failed
        default: false
      code-checks-enabled:
        type: boolean
        description: Enable code_checks
        default: true
      code-checks-bypassed:
        type: boolean
        description: Do not fail pipeline if code_checks failed
        default: false
      ort-enabled:
        type: boolean
        description: Enable ORT scanning
        default: true
      ort-bypassed:
        type: boolean
        description: Do not fail pipeline if ORT scan failed
        default: false
      ort-version:
        type: string
        description: ORT version to use
        default: "92.5.0"
      ort-config-repository:
        type: string
        description: ORT config repository to use
        default: ${{ vars.ORT_CONFIG_VCS_URL || 'https://github.com/epam/ai-dial-ort-config.git' }}
      ort-config-revision:
        type: string
        description: ORT config revision to use
        default: ${{ vars.ORT_CONFIG_VCS_REVISION || '92.5.0' }}
      docker-build-enabled:
        type: boolean
        description: "Enable Docker build"
        default: true
      trivy-enabled:
        type: boolean
        description: Enable Trivy scanning
        default: true
      trivy-bypassed:
        type: boolean
        description: Do not fail pipeline if Trivy failed
        default: false
      trivy-severity:
        type: string
        description: Severities of vulnerabilities to fail the build
        default: "CRITICAL,HIGH"
      trivy-severity-for-sarif:
        type: string
        description: Severities of vulnerabilities in SARIF report
        default: "CRITICAL,HIGH"
      trivy-limit-severities-for-sarif:
        type: boolean
        description: By default SARIF format enforces output of all vulnerabilities regardless of configured severities. To override this behavior set this parameter to true and specify desired severities in the `trivy-severity-for-sarif` parameter
        default: true
      publish-enabled:
        type: boolean
        description: Enable publish to npmjs
        default: true
      node-version:
        type: string
        description: NodeJS version to use
        default: "22"
      maximize-build-space:
        type: boolean
        description: Maximize build space by removing unwanted software
        default: false
      runs-on:
        type: string
        description: Overrides jobs runs-on settings (json-encoded list)
        default: '["ubuntu-24.04"]'
      platforms:
        type: string
        description: Docker build platforms (comma-separated). Each platform is built on its own native runner (supported - linux/amd64, linux/arm64)
        default: "linux/amd64"
      dockerfile-path:
        type: string
        description: Path to the Dockerfile
        default: "Dockerfile"
      filter-version:
        type: string
        description: Operate within versions matched regex
        default: '[0-9]+\.[0-9]+'
      primary-branch-pattern:
        type: string
        description: Regex pattern for the primary branch. Matching branch uses development flow
        default: '^development$'
      release-branch-pattern:
        type: string
        description: Regex pattern for release branches. Branch name must end with X.Y to extract release line
        default: '^release-[0-9]+\.[0-9]+$'
      docker-development-tag:
        type: string
        description: Development tag for docker images
        default: 'development'
      build-args:
        type: string
        description: |
          Docker build arguments (newline-separated list-like string)
          ref: https://github.com/docker/build-push-action#inputs
        default: ""

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/node_test.yml
    with:
      bypass-checks: ${{ inputs.bypass-checks }}
      format-checks-enabled: ${{ inputs.format-checks-enabled }}
      format-checks-bypassed: ${{ inputs.format-checks-bypassed }}
      style-checks-enabled: ${{ inputs.style-checks-enabled }}
      style-checks-bypassed: ${{ inputs.style-checks-bypassed }}
      code-checks-enabled: ${{ inputs.code-checks-enabled }}
      code-checks-bypassed: ${{ inputs.code-checks-bypassed }}
      ort-enabled: ${{ inputs.ort-enabled }}
      ort-bypassed: ${{ inputs.ort-bypassed }}
      ort-version: ${{ inputs.ort-version }}
      ort-config-repository: ${{ inputs.ort-config-repository }}
      ort-config-revision: ${{ inputs.ort-config-revision }}
      node-version: ${{ inputs.node-version }}
      runs-on: ${{ inputs.runs-on }}

  calculate_version:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    outputs:
      next-version: ${{ steps.semantic_versioning.outputs.next-version }}
      latest-stable-tag: ${{ steps.semantic_versioning.outputs.latest-stable-tag }}
      is-release-candidate: ${{ steps.semantic_versioning.outputs.is-release-candidate }}
      is-release: ${{ steps.semantic_versioning.outputs.is-release }}
      is-latest: ${{ steps.semantic_versioning.outputs.is-latest }}
      release-line: ${{ steps.semantic_versioning.outputs.release-line }}
      changelog-mode: ${{ steps.semantic_versioning.outputs.changelog-mode }}
    steps:
      - uses: epam/ai-dial-ci/actions/semantic_versioning@4.12.0
        id: semantic_versioning
        with:
          promote: ${{ inputs.promote }}
          filter-version: ${{ inputs.filter-version }}
          primary-branch-pattern: ${{ inputs.primary-branch-pattern }}
          release-branch-pattern: ${{ inputs.release-branch-pattern }}

  # Decides whether the Docker build runs and builds the per-platform matrix.
  docker_plan:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # HACK: jobs.<job_id>.if does not support hashFiles function, so the Dockerfile is checked here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.docker-build-enabled }}
        with:
          sparse-checkout: ${{ inputs.dockerfile-path }}
          sparse-checkout-cone-mode: false
      - name: Plan Docker build
        id: plan
        shell: bash
        env:
          DOCKER_BUILD_ENABLED: ${{ inputs.docker-build-enabled }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
          PLATFORMS: ${{ inputs.platforms }}
          RUNS_ON: ${{ inputs.runs-on }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "$DOCKER_BUILD_ENABLED" != "true" ] || [ ! -f "$DOCKERFILE_PATH" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matrix='[]'
          IFS=',' read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            platform="$(echo "$platform" | xargs)"
            case "$platform" in
              linux/amd64) runner="$RUNS_ON" ;;
              linux/arm64)
                if [ "$REPO_PRIVATE" = "true" ]; then
                  echo "::warning::linux/arm64 is not available for private repositories (no free native arm64 runners). Skipping it and building only the remaining platforms."
                  continue
                fi
                runner='["ubuntu-24.04-arm"]'
                ;;
              *) echo "::error::Unsupported platform '$platform': only linux/amd64 and linux/arm64 have native runners"; exit 1 ;;
            esac
            matrix="$(jq -c --arg p "$platform" --arg r "$runner" '. + [{platform: $p, runner: $r, pair: ($p | gsub("/"; "-"))}]' <<< "$matrix")"
          done
          if [ "$matrix" = '[]' ]; then
            echo "::error::No buildable platforms left in '$PLATFORMS' for this repository"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c '{include: .}' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  # One job per platform on a native runner: build -> Trivy -> push by digest.
  docker_build:
    name: docker_build (${{ matrix.platform }})
    needs: [test, calculate_version, docker_plan]
    if: ${{ needs.docker_plan.outputs.enabled == 'true' }}
    strategy:
      fail-fast: false # report Trivy results for every platform even if another one failed
      matrix: ${{ fromJSON(needs.docker_plan.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    permissions:
      contents: read
      packages: write # push to GHCR
      security-events: write # upload Trivy SARIF
    steps:
      - name: Maximize build space
        uses: nepalevov/maximize-build-space@046c48361370e2f3fa758bd2f10c6ce29109ef62 # v1.1.0
        if: ${{ inputs.maximize-build-space }}
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          remove-java: "true"
          remove-swift: "true"
          remove-julia: "true"
          remove-browsers: ${{ matrix.platform == 'linux/arm64' && 'false' || 'true' }}
          remove-cloud-tools: "true"
          remove-kubernetes-tools: "true"
          remove-powershell: "true"
          remove-container-tools: "true"
          remove-rust: "true"
          remove-python: "true"
          remove-node: "true"
          remove-go: "true"
          remove-ruby: "true"
          docker-cleanup: "true"
          set-tmpdir: "true"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: epam/ai-dial-ci/actions/node_prepare@4.12.0
        with:
          node-version: ${{ inputs.node-version }}
          clean-install: false
          registry-url: "https://registry.npmjs.org"
      - name: Set version
        shell: bash
        run: |
          npm version ${{ needs.calculate_version.outputs.next-version }} --no-git-tag-version --allow-same-version
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ghcr.io/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ startsWith(github.ref, 'refs/heads/release-') && needs.calculate_version.outputs.next-version || inputs.docker-development-tag }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACTIONS_BOT_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Build for scanning (native platform, loaded into the local image store)
      - name: Build and export to Docker
        if: ${{ inputs.trivy-enabled }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile-path }}
          load: true
          platforms: ${{ matrix.platform }}
          tags: scan/${{ matrix.pair }}:${{ github.sha }}
          build-args: ${{ inputs.build-args }}
          secrets: |
            GPR_USERNAME=${{ github.actor }}
            GPR_PASSWORD=${{ secrets.ACTIONS_BOT_TOKEN }}
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false

      - name: Run Trivy scanner (JSON output, no fail)
        id: trivy
        if: ${{ inputs.trivy-enabled }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.pair }}:${{ github.sha }}
          format: json
          exit-code: "0" # Findings are handled by the last "trivy convert" step
          output: trivy-results.json
          ignore-unfixed: "true"
          vuln-type: os,library
          scanners: vuln,secret
        env:
          TRIVY_DISABLE_VEX_NOTICE: true
        continue-on-error: ${{ inputs.trivy-bypassed || inputs.bypass-checks }}
      - name: Generate Trivy report (SARIF)
        id: trivy-generate-sarif
        # Do not generate SARIF reports on private repos - GitHub Advanced Security is not enabled
        if: ${{ steps.trivy.outcome == 'success' && !github.event.repository.private }}
        shell: bash
        run: trivy convert --format sarif --output trivy-results.sarif --exit-code 0 trivy-results.json
        env:
          TRIVY_SCANNERS: vuln,secret
          TRIVY_SEVERITY: ${{ inputs.trivy-limit-severities-for-sarif && inputs.trivy-severity-for-sarif || '' }}
          TRIVY_DISABLE_VEX_NOTICE: true
        continue-on-error: ${{ inputs.trivy-bypassed || inputs.bypass-checks }}
      - name: Upload Trivy report (SARIF)
        if: ${{ steps.trivy-generate-sarif.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.pair }}
        continue-on-error: ${{ inputs.trivy-bypassed || inputs.bypass-checks }}
      - name: Generate Trivy report (Table, must fail on findings)
        if: ${{ steps.trivy.outcome == 'success' }}
        shell: bash
        run: trivy convert --format table --exit-code 1 trivy-results.json
        env:
          TRIVY_SCANNERS: vuln,secret
          TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
          TRIVY_DISABLE_VEX_NOTICE: true
        continue-on-error: ${{ inputs.trivy-bypassed || inputs.bypass-checks }}

      # --- Push by digest (reached only when the Trivy steps above passed). Layers are reused from the builder's local cache.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile-path }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          outputs: type=image,"name=${{ env.IMAGE_NAME }},ghcr.io/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          secrets: |
            GPR_USERNAME=${{ github.actor }}
            GPR_PASSWORD=${{ secrets.ACTIONS_BOT_TOKEN }}
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
      - name: Export digest
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the multi-platform image. Runs only if every platform job
  # (build + Trivy + push) succeeded.
  docker_merge:
    needs: [calculate_version, docker_build]
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ghcr.io/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ startsWith(github.ref, 'refs/heads/release-') && needs.calculate_version.outputs.next-version || inputs.docker-development-tag }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/release-') && needs.calculate_version.outputs.is-latest == 'true' }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACTIONS_BOT_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create multi-platform images and push
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          set -euo pipefail
          annotations=()
          while IFS= read -r a; do
            [ -n "$a" ] && annotations+=(--annotation "$a")
          done < <(jq -r '.annotations // [] | .[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          for image in "${IMAGE_NAME}" "ghcr.io/${IMAGE_NAME}"; do
            tags=()
            while IFS= read -r t; do tags+=(-t "$t"); done \
              < <(jq -r --arg img "$image:" '.tags[] | select(startswith($img))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            sources=()
            for d in *; do sources+=("${image}@sha256:${d}"); done
            docker buildx imagetools create "${annotations[@]}" "${tags[@]}" "${sources[@]}"
          done
      - name: Inspect images
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r t; do
            docker buildx imagetools inspect "$t"
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

  # npm publish and git tag / GitHub release. Runs after the Docker image is published
  # (or when the Docker build is disabled / skipped).
  release:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: write
      id-token: write # for trusted publishing to npmjs registry
      packages: write # for publishing to GitHub Packages registry
    needs:
      - calculate_version
      - test
      - docker_merge
    if: ${{ !cancelled() && !failure() }}
    steps:
      - uses: epam/ai-dial-ci/actions/generate_release_notes@4.12.0
        with:
          latest-tag: ${{ needs.calculate_version.outputs.latest-stable-tag }}
          use-merge-base: ${{ needs.calculate_version.outputs.changelog-mode == 'merge-base' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          token: ${{ secrets.ACTIONS_BOT_TOKEN }}
      - uses: epam/ai-dial-ci/actions/node_prepare@4.12.0
        with:
          node-version: ${{ inputs.node-version }}
          clean-install: true
          registry-url: "https://registry.npmjs.org"
      - name: Set version
        shell: bash
        run: |
          npm version ${{ needs.calculate_version.outputs.next-version }} --no-git-tag-version --allow-same-version
      - name: Publish packages to npmjs
        if: ${{ inputs.publish-enabled }}
        shell: bash
        run: |
          #!/bin/bash
          # Builds and publishes the package to the npm registry.
          # Steps:
          # 1. (naive) check if a package with the same version is already exists in the registry
          # 2. build the package using either `build:publishable` (useful for monorepos) or `build` script
          # 3. publish the package using `publish:npm` script (if exists) or `npm publish` directly with distribution tags:
          #    - development branch --> `development` distribution tag
          #    - release candidate version --> `{release-line}-rc` distribution tag (e.g. `1.0-rc`)
          #    - stable version
          #      - `latest` distribution tag if it's semantically latest stable version
          #      - `release-{release-line}` distribution tag (e.g. `release-1.0`) for other stable versions. HACK: we have to use this tag, otherwise npm will create `latest` by default
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"
          if [[ "${CURRENT_BRANCH}" =~ ${PRIMARY_BRANCH_PATTERN} ]]; then
            IS_DEVELOPMENT="true"
          else
            IS_DEVELOPMENT="false"
          fi
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" &>/dev/null; then
            echo "Version $PACKAGE_NAME@$PACKAGE_VERSION already published, skipping"; exit 0
          fi
          if node -e "process.exit(require('./package.json').scripts?.['build:publishable'] ? 0 : 1)"; then
            npm run build:publishable
          else
            npm run build
          fi
          publish_with_tag() {
            local tag="$1"
            if node -e "process.exit(require('./package.json').scripts?.['publish:npm'] ? 0 : 1)"; then
              npm run publish:npm -- --tag "$tag"
            else
              npm publish --tag "$tag"
            fi
          }
          if [ "$IS_DEVELOPMENT" = "true" ]; then
            publish_with_tag "development"
          elif [ "$IS_RELEASE_CANDIDATE" = "true" ]; then
            publish_with_tag "$RELEASE_LINE-rc"
          elif [ "$IS_RELEASE" = "true" ]; then
            if [ "$IS_LATEST" = "true" ]; then
              publish_with_tag "latest"
            else
              publish_with_tag "release-$RELEASE_LINE"
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRIMARY_BRANCH_PATTERN: ${{ inputs.primary-branch-pattern }}
          IS_RELEASE_CANDIDATE: ${{ needs.calculate_version.outputs.is-release-candidate == 'true' }}
          IS_RELEASE: ${{ needs.calculate_version.outputs.is-release == 'true' }}
          IS_LATEST: ${{ needs.calculate_version.outputs.is-latest == 'true' }}
          RELEASE_LINE: ${{ needs.calculate_version.outputs.release-line }}
      - uses: epam/ai-dial-ci/actions/publish_tag_release@4.12.0
        if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
        with:
          git-user-name: ${{ vars.ACTIONS_BOT_NAME || 'ai-dial-actions' }}
          git-user-email: ${{ vars.ACTIONS_BOT_EMAIL || '149404362+ai-dial-actions@users.noreply.github.com' }}
          tag-version: ${{ needs.calculate_version.outputs.next-version }}
          changelog-file: "/tmp/my_changelog" # comes from generate_release_notes step; TODO: beautify
          draft-stable-releases: ${{ inputs.draft-stable-releases }}
          make-latest: ${{ needs.calculate_version.outputs.is-latest == 'true' }}
          extra-commit-command: |
            git add package.json package-lock.json
            git commit -m '[skip ci] Update version' || true # upstream branch may already be updated
