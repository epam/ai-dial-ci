name: Trigger GitLab CI/CD pipeline

on:
  workflow_call:
    inputs:
      gitlab-project-id:
        type: string
        description: The ID or path of the project owned by the authenticated user. You will find the Project ID in the General Settings of your GitLab project
        required: true
      gitlab-project-ref:
        type: string
        description: The GitLab project branch or tag to run the pipeline on
        default: "master"
      environment-name:
        type: string
        description: The GitHub environment name to use secrets and variables from
        default: "development"
      runs-on:
        type: string
        description: Overrides jobs runs-on settings (json-encoded list)
        default: '["ubuntu-latest", "ubuntu-slim"]'
    secrets:
      DEPLOY_HOST:
        required: true
      DEPLOY_TRIGGER_TOKEN:
        required: true
      DEPLOY_ACCESS_TOKEN:
        required: true

jobs:
  trigger:
    runs-on: ${{ inputs.runs-on }}
    concurrency: ${{ inputs.environment-name }}
    environment:
      name: ${{ inputs.environment-name }}
    steps:
      - uses: digital-blueprint/gitlab-pipeline-trigger-action@c59b56e9d2688ab42c1304322ac8831a4ef6f7d2 # v1.4.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          trigger_token: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
          access_token: ${{ secrets.DEPLOY_ACCESS_TOKEN }}
          id: ${{ inputs.gitlab-project-id }}
          ref: ${{ inputs.gitlab-project-ref }}
          verbose: true
          download_artifacts_on_failure: false
